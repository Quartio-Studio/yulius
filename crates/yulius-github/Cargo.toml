[package]
name = "yulius-github"
version = "0.1.0"
description = "GitHub REST, App and OAuth adapter."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.yulius]
layer = "adapter"

[features]
# In-process fake GitHub HTTP server for tests in this and other crates.
fake = ["dep:axum"]

[dependencies]
# Path + version (not `workspace = true`): cargo-deny `wildcards = "deny"` rejects versionless path deps.
yulius-domain = { path = "../yulius-domain", version = "0.1.0" }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
ring = { workspace = true }
base64 = { workspace = true }
axum = { workspace = true, optional = true }

[[test]]
name = "client"
required-features = ["fake"]
