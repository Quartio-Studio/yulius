<!doctype html>
<!-- The page the streamed-browser measurement loads in the sandbox Chrome (tests/live_ui_stream.rs). -->
<html><head><meta charset="utf-8"><title>Latency probe</title>
<style>
  body { margin: 0; font: 17px/1.55 Georgia, 'Noto Serif', serif; color: #1d1d1f; background: #f4f1ea; }
  #probe { position: fixed; left: 0; top: 0; z-index: 10; }
  header { position: sticky; top: 0; height: 64px; background: #20324a; color: #fff; display: flex; align-items: center; padding-left: 420px; font: 600 18px system-ui, sans-serif; z-index: 5; }
  main { max-width: 1180px; margin: 0 auto; padding: 24px; }
  .card { display: flex; gap: 20px; margin: 22px 0; padding: 18px; background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.18); }
  .card canvas { flex: none; border-radius: 6px; }
  .card h2 { margin: 0 0 6px; font: 700 21px system-ui, sans-serif; color: #2b4d7a; }
  .card p { margin: 0 0 8px; }
  #box { position: absolute; left: 600px; top: 200px; width: 120px; height: 90px; background: #d9480f; color: #fff; font: 600 14px system-ui; display: grid; place-items: center; border-radius: 8px; z-index: 4; cursor: grab; }
  #field { position: absolute; left: 820px; top: 120px; width: 260px; font-size: 18px; z-index: 4; }
</style></head>
<body>
<canvas id="probe" width="384" height="64"></canvas>
<header>Latency probe: a long page with text and pictures</header>
<input id="field" placeholder="type here">
<div id="box">drag me</div>
<main id="main"></main>
<script>
// Rows of 24 bits (16 px blocks, white = 1): scrollY, pointer x|y (12 bits each), input counter,
// and the XOR of the three and 0x5a5a5a as a check (a blank white or black frame fails it). The viewer decodes them from the decoded video.
const probe = document.getElementById('probe').getContext('2d');
let pointerX = 0, pointerY = 0, inputs = 0, last = '';
function row(r, value) {
  for (let b = 0; b < 24; b++) {
    probe.fillStyle = (value >> (23 - b)) & 1 ? '#fff' : '#000';
    probe.fillRect(b * 16, r * 16, 16, 16);
  }
}
function draw() {
  const s = Math.round(window.scrollY) & 0xffffff;
  const p = ((pointerX & 0xfff) << 12) | (pointerY & 0xfff);
  const c = inputs & 0xffffff;
  const key = `${s}|${p}|${c}`;
  if (key !== last) { last = key; row(0, s); row(1, p); row(2, c); row(3, s ^ p ^ c ^ 0x5a5a5a); }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
addEventListener('mousemove', (e) => { pointerX = e.clientX; pointerY = e.clientY; }, true);
addEventListener('mousedown', () => { inputs++; }, true);
addEventListener('keydown', () => { inputs++; }, true);
// Dragging the box: it follows the pointer while the button is held.
const box = document.getElementById('box');
let drag = null;
box.addEventListener('mousedown', (e) => { drag = { dx: e.pageX - box.offsetLeft, dy: e.pageY - box.offsetTop }; e.preventDefault(); });
addEventListener('mousemove', (e) => { if (drag) { box.style.left = `${e.pageX - drag.dx}px`; box.style.top = `${e.pageY - drag.dy}px`; } });
addEventListener('mouseup', () => { drag = null; });
// Content: text and generated pictures (gradients and detail, like photos and screenshots).
const words = 'lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua enim ad minim veniam quis nostrud exercitation ullamco laboris nisi aliquip ex ea commodo consequat duis aute irure in reprehenderit voluptate velit esse cillum fugiat nulla pariatur excepteur sint occaecat cupidatat non proident sunt culpa qui officia deserunt mollit anim id est laborum'.split(' ');
let seed = 7;
function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
function sentence(n) { let s = []; for (let i = 0; i < n; i++) s.push(words[Math.floor(rnd() * words.length)]); s[0] = s[0][0].toUpperCase() + s[0].slice(1); return s.join(' ') + '.'; }
const main = document.getElementById('main');
for (let i = 0; i < 160; i++) {
  const card = document.createElement('div');
  card.className = 'card';
  const pic = document.createElement('canvas');
  pic.width = 260; pic.height = 170;
  const g = pic.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 260, 170);
  grad.addColorStop(0, `hsl(${(i * 37) % 360} 70% 55%)`);
  grad.addColorStop(1, `hsl(${(i * 37 + 120) % 360} 60% 35%)`);
  g.fillStyle = grad; g.fillRect(0, 0, 260, 170);
  for (let k = 0; k < 60; k++) {
    g.fillStyle = `hsla(${Math.floor(rnd() * 360)} 80% ${Math.floor(30 + rnd() * 50)}% / .6)`;
    g.beginPath(); g.arc(rnd() * 260, rnd() * 170, 4 + rnd() * 22, 0, 7); g.fill();
  }
  const text = document.createElement('div');
  const h2 = document.createElement('h2');
  h2.textContent = `${i + 1}. ${sentence(5)}`;
  text.append(h2);
  for (let p = 0; p < 2; p++) { const para = document.createElement('p'); para.textContent = sentence(28) + ' ' + sentence(22); text.append(para); }
  card.append(pic, text);
  main.append(card);
}
</script>
</body></html>
