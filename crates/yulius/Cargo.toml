[package]
name = "yulius"
version = "0.1.0"
description = "The yulius binary: configuration, wiring and subcommands."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
# One integration test binary (tests/main.rs, SPEC-033): each links the whole product.
autotests = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "yulius"
path = "src/main.rs"

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true

[package.metadata.yulius]
layer = "composition"

[dependencies]
yulius-domain = { workspace = true }
yulius-contracts = { workspace = true }
yulius-app = { workspace = true }
yulius-store = { workspace = true }
yulius-server = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
yulius-harness = { workspace = true }
yulius-ptyhost = { workspace = true }
yulius-sandbox = { workspace = true }
yulius-git = { workspace = true }
yulius-github = { workspace = true }
yulius-import = { workspace = true }
console = { workspace = true }
yulius-browser = { workspace = true }
yulius-egress = { workspace = true }
rustls = { workspace = true }
reqwest = { workspace = true }
sysinfo = { workspace = true }
base64 = { workspace = true }
nix = { workspace = true }

[dev-dependencies]
yulius-ptyhost = { workspace = true, features = ["test-support"] }
yulius-store = { workspace = true, features = ["test-support"] }
yulius-browser = { workspace = true, features = ["fake"] }
yulius-github = { workspace = true, features = ["fake"] }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
tempfile = { workspace = true }
rusqlite = { workspace = true }
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1.5"
zeroize = { workspace = true }
