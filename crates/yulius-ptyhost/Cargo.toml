[package]
name = "yulius-ptyhost"
version = "0.1.0"
description = "Detached PTY host process owning one agent run, and its client."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.yulius]
layer = "adapter"

[features]
# Helpers for tests in this and other crates (fake agent discovery).
test-support = []

[dependencies]
# Explicit version: cargo-deny `wildcards = "deny"` rejects versionless path dependencies.
yulius-contracts = { path = "../yulius-contracts", version = "0.1.0" }
nix.workspace = true
portable-pty.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
vt100.workspace = true

[dev-dependencies]
yulius-ptyhost = { path = ".", version = "0.1.0", features = ["test-support"] }
tempfile.workspace = true
