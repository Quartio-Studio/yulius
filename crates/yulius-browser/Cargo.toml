[package]
name = "yulius-browser"
version = "0.1.0"
description = "Per-sandbox Chromium lifecycle and Chrome DevTools Protocol client."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.yulius]
layer = "adapter"

[features]
# In-process fake CDP server and fake Chromium launcher for tests (this crate's and the
# integrator's). Never enable in production builds.
fake = []

[dependencies]
# Internal crates as versioned path dependencies: `workspace = true` entries carry no version,
# which cargo-deny's `wildcards = "deny"` rejects (see the WP-E report).
yulius-contracts = { path = "../yulius-contracts", version = "0.1.0" }
yulius-domain = { path = "../yulius-domain", version = "0.1.0" }
base64 = { workspace = true }
futures = { workspace = true }
nix = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[[test]]
name = "cdp"
required-features = ["fake"]

[[test]]
name = "instance"
required-features = ["fake"]

[[test]]
name = "manager"
required-features = ["fake"]

[[test]]
name = "real_chromium"
