[package]
name = "yulius-editor"
version = "0.1.0"
description = "Per-sandbox VS Code (openvscode-server) lifecycle."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.yulius]
layer = "adapter"

[features]
# Builds the fake openvscode-server test executable. Never enable in production builds.
fake = []

[dependencies]
# Internal crates as versioned path dependencies: `workspace = true` entries carry no version,
# which cargo-deny's `wildcards = "deny"` rejects (see the WP-E report).
yulius-domain = { workspace = true }
nix = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "fake-openvscode-server"
path = "src/bin/fake_openvscode_server.rs"
required-features = ["fake"]
test = false
doc = false

[[test]]
name = "editor"
required-features = ["fake"]
