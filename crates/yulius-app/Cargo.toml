[package]
name = "yulius-app"
version = "0.1.0"
description = "Yulius application services, authorization decisions and ports."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.yulius]
layer = "application"

[dependencies]
yulius-domain = { workspace = true }
yulius-contracts = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
vt100 = { workspace = true }
# MCP server connection test (Streamable HTTP and stdio process-group kill).
reqwest = { workspace = true }
rustls = { workspace = true }
# Import server (CP10): chunk digests and snapshot archives.
sha2 = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
# Zeroed plaintexts of vault secrets (SPEC-002 ADR-20).
zeroize = { workspace = true }
# Basic credentials and fingerprint digests of the egress proxy and redaction (ADR-20).
base64 = { workspace = true }
# Process-group kill for bounded delivery environment runs (delivery::runner).
nix = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
