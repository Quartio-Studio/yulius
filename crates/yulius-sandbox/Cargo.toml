[package]
name = "yulius-sandbox"
version = "0.1.0"
description = "Sandbox isolation: the per-sandbox namespace holder, its system layer, relays, cgroups and seccomp."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.yulius]
layer = "adapter"

[dependencies]
yulius-contracts = { workspace = true }
nix = { workspace = true, features = ["sched", "mount"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
