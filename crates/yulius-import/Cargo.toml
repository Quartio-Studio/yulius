[package]
name = "yulius-import"
version = "0.1.0"
description = "Local repository and Claude/Codex session discovery and upload for yulius import."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.yulius]
layer = "adapter"

[dependencies]
yulius-contracts = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
tempfile = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
rustls = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true }
