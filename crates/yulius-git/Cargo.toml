[package]
name = "yulius-git"
version = "0.1.0"
description = "Git command-line adapter: clones, worktrees, branches and bundles."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.yulius]
layer = "adapter"

[dependencies]
# Path + version (not `workspace = true`): cargo-deny `wildcards = "deny"` rejects versionless path deps.
yulius-domain = { path = "../yulius-domain", version = "0.1.0" }
thiserror = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
