[package]
name = "yulius-egress"
version = "0.1.0"
description = "The credential-injecting egress proxy of agent runs (secrets vault, SPEC-002 ADR-20)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.yulius]
layer = "adapter"

[dependencies]
yulius-domain = { workspace = true }
yulius-app = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
# HTTP/1.1 server inside intercepted TLS, upgrades of CONNECT tunnels.
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util = { workspace = true }
# TLS toward the agent (leaf certificates of the egress CA) and verified HTTPS upstream.
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rcgen = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }

[dev-dependencies]
async-trait = { workspace = true }
