# The Vidoc security scan, `scripts/dev security` (SPEC-131, ADR-0107; SPEC-195, ADR-0157). With
# `enabled = false` it exits 0 at once and says nothing was scanned; agents then report the scan as
# disabled, never as passed. Turn it off in a reviewed pull request that says why. Without this
# file the scan is on. `exclude` (globs) and `[[ignore]]` (path, title, reason) are reviewed like
# code.
enabled = true
# mock.js is the web UI's in-browser fake backend for the e2e tests (`?mock=1`, loaded only by
# `import('./mock.js')` then): its "missing authorization" holds fake data in the viewer's own
# browser and guards nothing. The real API's checks are in yulius-app and are scanned. (Its first
# scan, PR #600, reported 3 high findings of that kind there.) `?mock=1` also works on a real
# origin, so this holds only while mock.js has no DOM sink (innerHTML, eval, document.write,
# location assignment): rendering stays in scanned code. Remove the exclusion if it gains one.
exclude = ["crates/yulius-server/web/assets/mock.js"]

# Reported against the browser port's documented trust model, not code of this file: the
# endpoint is the adapter's Chromium launch (yulius-browser). The weakness is real and tracked in
# #626; remove this entry with its fix. Reported when task #193 (SPEC-206) added `stop`.
[[ignore]]
path = "crates/yulius-app/src/ports/browser.rs"
title = "Unauthenticated"
reason = "pre-existing, documented trust model of the browser adapter; tracked in #626"

# `yulius gh-token` holds no credential: it asks `/internal/git-credential` (loopback) with the
# caller's own bearer (`YULIUS_TASK_TOKEN`, a shell's workspace token), and the server decides what
# token that caller gets: a person's shell its own token (SPEC-004 GH-001), an agent run a narrowed
# installation token (GH-006, ADR-0114). Without a valid bearer it prints nothing. First reported
# on task #192's change scan, which sent main.rs for an unrelated subcommand; the code predates it.
[[ignore]]
path = "crates/yulius/src/main.rs"
title = "gh-token"
reason = "gh-token prints only what /internal/git-credential gives the caller's own bearer; the server authorizes (SPEC-004 GH-001/GH-006, ADR-0114)"

# `agent_secret_value` (MCP `${secret:NAME}` references) reads `store.vault_agent`, the stored
# secrets only; the instance Vidoc key's virtual record is added solely by `applied_agent_secrets`
# (the proxy and placeholder paths, none of which hands out a value), so a reference never
# resolves it. This test asserts exactly that:
# vidoc_key::the_instance_key_is_never_handed_out_in_clear
# First reported on task #198's change scan, which sent runtime.rs for new `secrets_list`
# guidance; the code predates it. The independent reviewer of #198 agreed it is a false positive.
[[ignore]]
path = "crates/yulius-app/src/vault/runtime.rs"
title = "Instance Vidoc key leaked through MCP"
reason = "agent_secret_value reads stored secrets only (vault_agent), never the virtual Vidoc record; tested by vidoc_key::the_instance_key_is_never_handed_out_in_clear"

