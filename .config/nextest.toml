[profile.default]
retries = 0
slow-timeout = { period = "30s", terminate-after = 4 }
# Test threads: one per CPU by default. Where Yulius runs the suite (agent sessions, terminals, CI
# jobs) it sets NEXTEST_TEST_THREADS to the process's CPU budget ([resources.env] in yulius.toml,
# SPEC-082), so several runs at once share the machine instead of each taking all of it.

[profile.ci]
fail-fast = false

[profile.ci.junit]
path = "junit.xml"
