name: Web UI e2e

# End-to-end tests of the web UI in mock mode (e2e/, #86). Advisory: not a required check. Runs
# only when the UI, the suite or this workflow changes. Agent steps are skipped: no model key is
# given to CI.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'crates/yulius-server/web/**'
      - 'e2e/**'
      - '.github/workflows/e2e.yml'
  push:
    branches: [dev, main]
    paths:
      - 'crates/yulius-server/web/**'
      - 'e2e/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-ui:
    name: e2e (web UI)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    defaults:
      run:
        working-directory: e2e
    env:
      E2E_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: e2e/.node-version
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install the suite
        run: npm ci --ignore-scripts
      - name: Cache browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install Chromium
        run: npx e2e-web install chromium --with-deps
      - name: Run the suite
        run: npx e2e run --reporter list,junit
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-report
          path: |
            e2e/.e2e/report.json
            e2e/.e2e/junit.xml
            e2e/.e2e/results
          if-no-files-found: warn
          retention-days: 7
