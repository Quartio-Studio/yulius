# Yulius project contract. Existing documents are mapped, not moved.

[docs]
product = "docs/product.md"
architecture = "docs/architecture.md"
decisions = "docs/decisions"
specs_dir = ".ai/specs"
changes = "docs/changes.md"
agents = "AGENTS.md"

[commands]
test = "scripts/dev test"
lint = "scripts/dev lint"
build = "scripts/dev check"

[delivery]
preset = "standard"
integration_branch = "dev"
production_branch = "main"

# macOS has no Yulius runner: run `scripts/dev ci` on a Mac before promotion. The branch policy
# (scripts/check_git_policy.py) is checked by hand until it joins Yulius's merge gate (#223).
[[ci.jobs]]
name = "quality"
command = "python3 scripts/bootstrap.py --install-rustup && scripts/dev ci"

[[ci.jobs]]
name = "e2e"
command = "cd e2e && npm ci --ignore-scripts && npx e2e-web install chromium --with-deps && E2E_TELEMETRY_DISABLED=1 npx e2e run --reporter list,junit"
