# Yulius project contract. Existing documents are mapped, not moved.

[docs]
product = "docs/product.md"
architecture = "docs/architecture.md"
decisions = "docs/decisions"
specs_dir = ".ai/specs"
changes = "docs/changes.md"
agents = "AGENTS.md"

[commands]
test = "scripts/dev test"
lint = "scripts/dev lint"
build = "scripts/dev check"

[delivery]
preset = "standard"
integration_branch = "dev"
production_branch = "main"

# The rules Yulius's merge gate checks before every merge (SPEC-069): typed branches, conventional
# titles of at most 100 characters, promotions `release: promote dev to main[ - label]`.
[branch_policy]
preset = "standard"

# What the CPU and memory budget Yulius gives a process (YULIUS_CPUS, YULIUS_MEMORY_MB) means for
# this repository's tools, in agent sessions, terminals and CI jobs alike (SPEC-082). Each process
# sizes its builds and test threads to its share instead of to the whole machine: agents' local
# test runs at one thread per CPU each starved each other and CI (load 35-47 on 12 CPUs,
# 2026-10-13).
[resources.env]
CARGO_BUILD_JOBS = "{cpus}"
NEXTEST_TEST_THREADS = "{cpus}"
RUST_TEST_THREADS = "{cpus}"

# macOS has no Yulius runner: run `scripts/dev ci` on a Mac before promotion. Each job gets an
# equal share of the sandbox (two jobs: half each), and a run's jobs wait for theirs.
[[ci.jobs]]
name = "quality"
command = "python3 scripts/bootstrap.py --install-rustup && scripts/dev ci"

# The browser's system libraries are installed once in the sandbox (onboarding); installing them
# on every run (`--with-deps`, apt) raced the other CI lane and agents for the dpkg lock and
# failed runs before any test (F 2026-10-13).
[[ci.jobs]]
name = "e2e"
command = "cd e2e && npm ci --ignore-scripts && npx e2e-web install chromium && E2E_TELEMETRY_DISABLED=1 npx e2e run --reporter list,junit"

# The Vidoc scan (ADR-0104, ADR-0116) on pull request heads only: dev and main have nothing of their
# own to scan. Findings (exit 1) fail it. Exit 2 (the scan could not run: no key, a rejected one,
# #470, or a missing host binding) does not, so no pull request is blocked by what only a person can
# fix; the output says it did not run. It gets VIDOC_API_KEY (a placeholder through the egress
# proxy, never the value) once this entry has `secrets = "VIDOC_API_KEY"`: that line waits until the
# running Yulius instance knows the key (after dev is promoted to main), because an older instance
# rejects the whole file and CI would stop for every pull request (SPEC-142, #466).
[[ci.jobs]]
name = "security"
command = 'case "$YULIUS_CI_REF" in pr/*) python3 scripts/bootstrap.py --install-rustup && { scripts/dev security; code=$?; if [ "$code" -eq 2 ]; then echo "[yulius] the security scan did not run (exit 2, reason above): not passed; it does not fail the job until a scan can run (#470)"; code=0; fi; exit "$code"; } ;; *) echo "Not a pull request head: Vidoc scans pull requests only (ADR-0116)." ;; esac'

# CD (deployment), SPEC-134: Yulius runs these from the protected branches, inside the sandbox
# (CD page, `cd_deploy`). Both are explicit, even when one deploys nothing yet. A merge deploys
# nothing; only a person deploys production (ADR-0110).
[cd.dev]
about = "No dev machine yet: once a person adds its credentials to the vault, an agent writes scripts/cd/ and fills this in"

[cd.prod]
about = "A push to main is the release: instances update themselves from main (Settings, Instance, Update now)"
promote = true

# Build caches beyond the recognised ones (SPEC-008): pruned for tasks that do not work.
[disk]
caches = "e2e/node_modules tools/vidoc/node_modules"
