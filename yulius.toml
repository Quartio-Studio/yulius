# Yulius project contract. Existing documents are mapped, not moved.

[docs]
product = "docs/product.md"
architecture = "docs/architecture.md"
decisions = "docs/decisions"
specs_dir = ".ai/specs"
changes = "docs/changes.md"
agents = "AGENTS.md"

[commands]
test = "scripts/dev test"
lint = "scripts/dev lint"
build = "scripts/dev check"

[delivery]
preset = "standard"
integration_branch = "dev"
production_branch = "main"

# The rules Yulius's merge gate checks before every merge (SPEC-069): typed branches, conventional
# titles of at most 100 characters, promotions `release: promote dev to main[ - label]`.
[branch_policy]
preset = "standard"

# What the CPU and memory budget Yulius gives a process (YULIUS_CPUS, YULIUS_MEMORY_MB) means for
# this repository's tools, in agent sessions, terminals and CI jobs alike (SPEC-082). Each process
# sizes its builds and test threads to its share instead of to the whole machine: agents' local
# test runs at one thread per CPU each starved each other and CI (load 35-47 on 12 CPUs,
# 2026-10-13).
[resources.env]
CARGO_BUILD_JOBS = "{cpus}"
NEXTEST_TEST_THREADS = "{cpus}"
RUST_TEST_THREADS = "{cpus}"

# macOS has no Yulius runner: run `scripts/dev ci` on a Mac before promotion. Each job gets an
# equal share of the sandbox (two jobs: half each), and a run's jobs wait for theirs.
[[ci.jobs]]
name = "quality"
command = "python3 scripts/bootstrap.py --install-rustup && scripts/dev ci"

# The browser's system libraries are installed once in the sandbox (onboarding); installing them
# on every run (`--with-deps`, apt) raced the other CI lane and agents for the dpkg lock and
# failed runs before any test (F 2026-10-13).
[[ci.jobs]]
name = "e2e"
command = "cd e2e && npm ci --ignore-scripts && npx e2e-web install chromium && E2E_TELEMETRY_DISABLED=1 npx e2e run --reporter list,junit"

# Build caches beyond the recognised ones (SPEC-008): pruned for tasks that do not work.
[disk]
caches = "e2e/node_modules"
