# Yulius project contract. Existing documents are mapped, not moved.

[docs]
product = "docs/product.md"
architecture = "docs/architecture.md"
decisions = "docs/decisions"
specs_dir = ".ai/specs"
changes = "docs/changes.md"
agents = "AGENTS.md"

[commands]
test = "scripts/dev test"
lint = "scripts/dev lint"
build = "scripts/dev check"

[delivery]
preset = "standard"
integration_branch = "dev"
production_branch = "main"

# macOS has no Yulius runner: run `scripts/dev ci` on a Mac before promotion. The branch policy
# (scripts/check_git_policy.py) is checked by hand until it joins Yulius's merge gate (#223).
[[ci.jobs]]
name = "quality"
command = "python3 scripts/bootstrap.py --install-rustup && scripts/dev ci"

# The browser's system libraries are installed once in the sandbox (onboarding); installing them
# on every run (`--with-deps`, apt) raced the other CI lane and agents for the dpkg lock and
# failed runs before any test (F 2026-10-13).
[[ci.jobs]]
name = "e2e"
command = "cd e2e && npm ci --ignore-scripts && npx e2e-web install chromium && E2E_TELEMETRY_DISABLED=1 npx e2e run --reporter list,junit"

# Build caches beyond the recognised ones (SPEC-008): pruned for tasks that do not work.
[disk]
caches = "e2e/node_modules"
