# Yulius project contract. Existing documents are mapped, not moved.

[docs]
product = "docs/product.md"
architecture = "docs/architecture.md"
decisions = "docs/decisions"
specs_dir = ".ai/specs"
changes = "docs/changes.md"
agents = "AGENTS.md"

[commands]
test = "scripts/dev test"
lint = "scripts/dev lint"
build = "scripts/dev check"

[delivery]
preset = "standard"
integration_branch = "dev"
production_branch = "main"

# The rules Yulius's merge gate checks before every merge (SPEC-069): typed branches, conventional
# titles of at most 100 characters, promotions `release: promote dev to main[ - label]`.
[branch_policy]
preset = "standard"

# What the CPU and memory budget Yulius gives a process (YULIUS_CPUS, YULIUS_MEMORY_MB) means for
# this repository's tools, in agent sessions, terminals and CI jobs alike (SPEC-082). Each process
# sizes its builds and test threads to its share instead of to the whole machine: agents' local
# test runs at one thread per CPU each starved each other and CI (load 35-47 on 12 CPUs,
# 2026-10-13).
[resources.env]
CARGO_BUILD_JOBS = "{cpus}"
NEXTEST_TEST_THREADS = "{cpus}"
RUST_TEST_THREADS = "{cpus}"

# macOS has no Yulius runner: the gate compiles every target for macOS (ADR-0169); run
# `scripts/dev ci` on a Mac before a release to link and test there. Each job without `cpus`
# gets an equal share of CI's budget (ADR-0350); CI's measured use, not the shares, decides when
# a job starts (ADR-0353).
# Each quality pass has an independent checkout, CPU budget and verdict. Under Yulius CI
# scripts/dev bootstraps the toolchain first, and each gate names its stages.
# `quality` compiles nothing: `lint` compiles every target.
[[ci.jobs]]
name = "quality"
command = "scripts/dev quality"

[[ci.jobs]]
name = "lint"
command = "scripts/dev lint"

[[ci.jobs]]
name = "macos"
command = "scripts/dev macos"

[[ci.jobs]]
name = "docs"
command = "scripts/dev docs"

[[ci.jobs]]
name = "deps"
cpus = 2
command = "scripts/dev deps"

# File-reading Rust contracts run on the head and the merge train (SPEC-610).
[[ci.jobs]]
name = "file-contracts"
paths = ["crates/**", "tools/**", "catalog/**", "docs/**", ".apm/**", ".agents/skills/**", ".claude/skills/**", ".ai/**", ".config/**", "deploy/**", "scripts/**", "AGENTS.md", "README.md", "LICENSE", "yulius.toml"]
command = "python3 scripts/repository_tests.py"

# The full suite (SPEC-591, ADR-0436): both test shards and e2e run on the merged revision, once,
# not on pull requests; `[cd.dev]`, the merge-first staging target, changes only to a revision
# whose full suite passed, and production is promoted only from what staging verified. A pull
# request runs the quality jobs, security, affected file contracts and changed job definitions.
[[ci.jobs]]
name = "test"
# The old five-job gate gave each shard 22 CPUs on the 112-CPU CI host. With
# four default compiler shares plus deps, e2e and security, two shares of 21 fit.
cpus = 21
matrix = "1/2 2/2"
after_merge = true
command = "scripts/dev test-shard"

# The browser's system libraries are installed once in the sandbox (onboarding); installing them
# on every run (`--with-deps`, apt) raced the other CI lane and agents for the dpkg lock and
# failed runs before any test (F 2026-10-13).
# Its workers are half its CPUs (e2e.config.ts): 18 CPUs, the share it had beside two other jobs,
# keep its 9 workers now that the run has five (review round 1 of slice D: 5 workers took 8.6
# min against 5.2).
[[ci.jobs]]
name = "e2e"
cpus = 18
after_merge = true
command = "cd e2e && npm ci --ignore-scripts && npx e2e-web install chromium && E2E_TELEMETRY_DISABLED=1 npx e2e run --reporter list,junit"

# The Vidoc security scan on vidoc-1 (SPEC-195, ADR-0157) of pull request heads: the files the pull
# request changed against dev, read from its commits. Findings (exit 1) fail the job, without
# cancelling the others. A scan that could not run (no key, a refused one, out of quota) and every
# other head end skipped with $YULIUS_CI_SKIP_CODE (ADR-0133), never passed; one that Vidoc's
# outage left incomplete exits $YULIUS_CI_INCOMPLETE_CODE and ends error (ADR-0202). The job runs the pull request's own
# scanner; other projects run the instance's, `yulius security-scan --ci`. VIDOC_API_KEY is a
# placeholder the egress proxy replaces for model.vidocsecurity.com: this project's agent secret,
# else the instance's Vidoc key (ADR-0116).
[[ci.jobs]]
name = "security"
cpus = 1
secrets = "VIDOC_API_KEY"
command = "python3 scripts/vidoc_scan.py --ci"

# CD (deployment), SPEC-134, SPEC-575: Yulius runs these from the protected branches, dev inside
# the sandbox and production in its production holder (ADR-0208; CD page, `cd_deploy`). Both are
# explicit, even when one deploys nothing yet. A merge deploys nothing by itself: with a shared
# staging target (`merge_first = true`), a task requests staging with `cd_deploy` after the
# merged revision passes the full gate (ADR-0410, ADR-0411); without one, the full suite gates
# each pull request (ADR-0415). Only a person deploys production (ADR-0110).
#
# [cd.dev] is Yulius's own staging VM (SPEC-591, ADR-0430): a Yulius instance no person relies on,
# where each deploy runs the exact build of a dev revision on a store an older release wrote.
# scripts/cd builds the commit in this run's Docker (Ubuntu 24.04), copies it over SSH to
# root@$STAGING_VM_HOST (a project variable; the host key pinned in scripts/cd/known_hosts), keeps
# the replaced release with the store it left, and restarts only yulius.service. Verify: the
# commit at /internal/version, /healthz over HTTPS, the contained doctor, the store migrated with
# the migration checked on a copy before the stop (no rows lost), and the sandbox Docker smoke test. Swapping the VM: docs/operations.md,
# "Yulius's own staging VM".
[cd.dev]
merge_first = true
about = "Yulius's own staging VM, the merge-first target no person relies on: the exact build of a dev revision whose full suite passed; its migration checked on a copy first; verify: commit, HTTPS, contained doctor, schema, Docker smoke"
deploy = "scripts/cd/deploy.sh dev"
verify = "scripts/cd/verify.sh dev"
rollback = "scripts/cd/rollback.sh dev"
migrations = "embedded SQLite, migrated forward at the new server's start; each deploy keeps the store the replaced release left, and a rollback across a schema change restores the release's own store (staging data written since is lost)"
secrets = "STAGING_VM_SSH_KEY"

[cd.prod]
about = "A push to main is the release: each instance installs it when a superadmin chooses Update now (Settings, Instance). Rollback (ADR-0264): an update whose new build fails to start (its health check) restores the previous binary and database by itself; otherwise revert on dev and promote again"
promote = true

# Build caches beyond the recognised ones (SPEC-008): pruned for tasks that do not work.
[disk]
caches = "e2e/node_modules"
